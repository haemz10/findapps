name: Build Android AABs

on:
  push:
    branches: [ "**" ]
    paths:
      - "apps/**"
      - "mobile/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: cozy-collector, alias: cozy }
          - { dir: sleepy-koala,   alias: koala }
          - { dir: smile-coach,    alias: smile }
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install JS deps
        working-directory: mobile/${{ matrix.dir }}
        run: npm ci || npm install

      - name: Sync web assets into Capacitor project
        run: bash mobile/sync-web.sh

      - name: Capacitor sync
        working-directory: mobile/${{ matrix.dir }}
        run: npx cap sync android

      # 서명: 저장소 시크릿이 설정된 경우에만 릴리스 서명을 구성한다.
      #   RELEASE_KEYSTORE_BASE64  : `base64 -w0 findapps-upload.keystore` 결과
      #   RELEASE_STORE_PASSWORD   : 키스토어 비밀번호
      #   RELEASE_KEY_PASSWORD     : 키 비밀번호(동일)
      - name: Configure signing
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: mobile/${{ matrix.dir }}/android
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PW: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > upload.keystore
          cat > keystore.properties <<EOF
          storeFile=$(pwd)/upload.keystore
          storePassword=${STORE_PW}
          keyAlias=${{ matrix.alias }}
          keyPassword=${KEY_PW}
          EOF

      - name: Build release AAB
        working-directory: mobile/${{ matrix.dir }}/android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.dir }}-aab
          path: mobile/${{ matrix.dir }}/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
