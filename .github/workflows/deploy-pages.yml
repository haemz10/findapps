name: Deploy site to GitHub Pages

# Auto-deploys the landing page + launch dashboard on every push.
# One-time human step: repo Settings -> Pages -> Source: "GitHub Actions".
# After that, every push publishes automatically — no further action.

on:
  push:
    branches: ["claude/ai-automation-monthly-income-ls9d0w", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          # Only the customer-facing landing page is published.
          # The launch dashboard stays private (it holds your revenue numbers).
          cp landing/index.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
